<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Kita gunakan CSS yang sama dengan Login, ditambah sedikit penyesuaian */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px; /* Sedikit lebih lebar untuk register */
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #333; }
        .header p { color: #666; font-size: 14px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .input-wrapper input:focus { border-color: #764ba2; }
        .input-wrapper i {
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%); cursor: pointer; color: #888;
        }

        .btn {
            width: 100%; padding: 12px; margin-top: 10px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white; border: none; border-radius: 6px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }

        .footer-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .footer-link a { color: #764ba2; text-decoration: none; font-weight: 600; }

        .error-text { color: #e74c3c; font-size: 11px; margin-top: 3px; display: none; }
        .input-error { border-color: #e74c3c !important; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>Buat Akun</h2>
            <p>Mulai perjalanan Anda sekarang</p>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <label>Nama Lengkap</label>
                <div class="input-wrapper">
                    <input type="text" id="fullname" placeholder="John Doe">
                </div>
                <span class="error-text" id="nameError">Nama wajib diisi</span>
            </div>

            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="contoh@email.com">
                </div>
                <span class="error-text" id="emailError">Format email salah</span>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Min. 6 karakter">
                    <i class="fa-solid fa-eye" onclick="togglePass('password', this)"></i>
                </div>
                <span class="error-text" id="passError">Password minimal 6 karakter</span>
            </div>

            <div class="input-group">
                <label>Ulangi Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPass" placeholder="Masukkan ulang password">
                    <i class="fa-solid fa-eye" onclick="togglePass('confirmPass', this)"></i>
                </div>
                <span class="error-text" id="confirmError">Password tidak cocok!</span>
            </div>

            <button type="submit" class="btn">Daftar</button>
        </form>

        <div class="footer-link">
            Sudah punya akun? <a href="login.html">Masuk disini</a>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT REGISTER ---

        // Fungsi Toggle Password (Reusable)
        function togglePass(id, icon) {
            let input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        // Validasi Pendaftaran
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();

            // Ambil elemen
            const name = document.getElementById("fullname");
            const email = document.getElementById("email");
            const pass = document.getElementById("password");
            const confirm = document.getElementById("confirmPass");

            let isValid = true;

            // Fungsi Helper untuk Error
            function showError(input, msgId) {
                input.classList.add("input-error");
                document.getElementById(msgId).style.display = "block";
                isValid = false;
            }

            function clearErrors() {
                document.querySelectorAll("input").forEach(i => i.classList.remove("input-error"));
                document.querySelectorAll(".error-text").forEach(e => e.style.display = "none");
            }

            clearErrors();

            // Validasi Logika
            if(name.value.trim() === "") showError(name, "nameError");
            
            if(email.value.trim() === "" || !email.value.includes("@")) showError(email, "emailError");
            
            if(pass.value.length < 6) showError(pass, "passError");
            
            if(pass.value !== confirm.value || confirm.value === "") showError(confirm, "confirmError");

            // Jika Valid
            if(isValid) {
                const btn = document.querySelector(".btn");
                btn.textContent = "Memproses...";
                btn.disabled = true;

                setTimeout(() => {
                    alert("Pendaftaran Berhasil! Silakan Login.");
                    window.location.href = "login.html"; // Arahkan ke login
                }, 1500);
            }
        });
    </script>
</body>
</html>
